appId: com.anotherwhy.zero
---
- launchApp:
    clearState: true
- tapOn:
    id: splash-get-started
- tapOn:
    id: welcome-get-started
- tapOn:
    id: onboarding-name
- inputText:
    text: Eve User
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: onboarding-personalize-continue
- tapOn:
    id: onboarding-category-food
- tapOn:
    id: onboarding-categories-continue
- tapOn:
    id: onboarding-currency-search
- inputText:
    text: USD
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: currency-option-USD
- tapOn:
    id: onboarding-currency-continue
- assertVisible:
    id: home-screen-header
- tapOn:
    id: home-add-transaction
- assertVisible:
    id: add-entry-expense-tab
- assertVisible:
    id: add-entry-expense-title
- tapOn:
    id: add-entry-income-tab
- assertVisible:
    id: add-entry-income-title
- assertVisible:
    id: add-entry-income-amount
- tapOn:
    id: add-entry-expense-tab
- assertVisible:
    id: add-entry-expense-title
