appId: com.anotherwhy.zero
---
- launchApp:
    clearState: true
- tapOn:
    id: splash-get-started
- tapOn:
    id: welcome-get-started
- tapOn:
    id: onboarding-name
- inputText:
    text: Eve User
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: onboarding-personalize-continue
- tapOn:
    id: onboarding-category-food
- tapOn:
    id: onboarding-categories-continue
- tapOn:
    id: onboarding-currency-search
- inputText:
    text: USD
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: currency-option-USD
- tapOn:
    id: onboarding-currency-continue
- assertVisible:
    id: home-screen-header
- tapOn:
    id: zero-tab-ReportsScreen
- assertVisible:
    id: reports-screen-header
- tapOn:
    id: zero-tab-CategoryScreen
- assertVisible:
    id: categories-screen-header
- tapOn:
    id: zero-tab-DebtsScreen
- assertVisible:
    id: debts-screen-header
- tapOn:
    id: zero-tab-HomeScreen
- assertVisible:
    id: home-screen-header
