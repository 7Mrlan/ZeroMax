pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'zero'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// WatermelonDB's optional JSI native module is not exposed by its autolinking
// config. Keep it on the same 0.28.0 source as the bridge package.
include ':nozbe_watermelondb_jsi'
project(':nozbe_watermelondb_jsi').projectDir = file('../node_modules/@nozbe/watermelondb/native/android-jsi')
