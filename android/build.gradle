buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "28.0.12916984"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// AGP 9 disables library BuildConfig generation by default. WatermelonDB 0.28
// still references its library BuildConfig.DEBUG in the native driver, so
// enable only this dependency's generated class without patching node_modules.
project(':nozbe_watermelondb') {
    afterEvaluate {
        android.buildFeatures.buildConfig = true
    }
}
